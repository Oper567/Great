<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring with Golden Yellow Accents -->
  <circle cx="250" cy="250" r="236" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#1E40AF" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Academic Shield Crest -->
  <path d="M 140,110 
           L 360,110 
           Q 360,250 250,370 
           Q 140,250 140,110 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#dropShadow)"/>

  <!-- Shield Inner Border -->
  <path d="M 152,122 
           L 348,122 
           Q 348,244 250,352 
           Q 152,244 152,122 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-opacity="0.5"/>

  <!-- Heraldic Cross Divider inside Shield -->
  <line x1="250" y1="122" x2="250" y2="352" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="152" y1="210" x2="348" y2="210" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- TOP-LEFT: Open Book of Knowledge (Montessori) -->
  <g transform="translate(175, 145) scale(0.9)">
    <!-- Left Page -->
    <path d="M 25,25 Q 12,20 0,22 L 0,42 Q 12,40 25,45 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M 25,25 Q 38,20 50,22 L 50,42 Q 38,40 25,45 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Spine -->
    <path d="M 25,25 L 25,45" stroke="#D97706" stroke-width="2"/>
    <!-- Page lines -->
    <line x1="4" y1="27" x2="20" y2="29" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="4" y1="33" x2="20" y2="35" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="30" y1="29" x2="46" y2="27" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="30" y1="35" x2="46" y2="33" stroke="#94A3B8" stroke-width="1.2"/>
  </g>

  <!-- TOP-RIGHT: Flaming Torch of Leadership & Enlightenment -->
  <g transform="translate(295, 142) scale(0.85)">
    <!-- Flame (Golden Yellow & Red Accent) -->
    <path d="M 15,0 Q 25,12 18,22 Q 28,15 20,30 Q 10,25 15,0 Z" fill="#DC2626"/>
    <path d="M 15,6 Q 22,14 17,22 Q 22,18 17,28 Q 11,24 15,6 Z" fill="url(#goldGrad)"/>
    <!-- Torch Handle -->
    <path d="M 10,28 L 22,28 L 18,48 L 14,48 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1"/>
  </g>

  <!-- BOTTOM-LEFT: Kelly Green Laurel / Olive Branch (Growth & Excellence) -->
  <g transform="translate(170, 235) scale(0.75)">
    <path d="M 35,45 Q 25,25 15,10" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="18" cy="12" rx="6" ry="3" transform="rotate(-30, 18, 12)" fill="#15803D"/>
    <ellipse cx="22" cy="22" rx="6" ry="3" transform="rotate(-15, 22, 22)" fill="#16A34A"/>
    <ellipse cx="27" cy="32" rx="6" ry="3" transform="rotate(5, 27, 32)" fill="#22C55E"/>
  </g>

  <!-- BOTTOM-RIGHT: Guiding Star / Compass (Vision & Global Leadership) -->
  <g transform="translate(295, 240) scale(0.8)">
    <polygon points="20,0 24,14 38,18 24,22 20,36 16,22 2,18 16,14" fill="url(#goldGrad)"/>
    <circle cx="20" cy="18" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Center Shield Monogram (GFMS) -->
  <circle cx="250" cy="210" r="22" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <text x="250" y="216" font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">GFMS</text>

  <!-- Established 2014 Badge inside Crest -->
  <rect x="210" y="300" width="80" height="20" rx="10" fill="url(#goldGrad)" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="250" y="314" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">EST. 2014</text>

  <!-- Circular Upper Text: GREAT-FAVOUR MONTESSORI SCHOOL -->
  <path id="upperTextPath" d="M 75,250 A 175,175 0 0,1 425,250" fill="none"/>
  <text font-family="'Cinzel', 'Georgia', serif" font-size="19" font-weight="800" fill="#1E40AF" letter-spacing="2.5">
    <textPath href="#upperTextPath" startOffset="50%" text-anchor="middle">
      GREAT-FAVOUR MONTESSORI SCHOOL
    </textPath>
  </text>

  <!-- Bottom Ribbon / Banner: LEADERSHIP ACADEMY -->
  <g filter="url(#dropShadow)">
    <!-- Ribbon Tails -->
    <path d="M 65,405 L 105,385 L 105,430 Z" fill="#92400E"/>
    <path d="M 435,405 L 395,385 L 395,430 Z" fill="#92400E"/>
    
    <!-- Ribbon Body -->
    <path d="M 90,380 
             L 410,380 
             Q 425,380 425,398 
             L 405,435 
             Q 250,455 95,435 
             L 75,398 
             Q 75,380 90,380 Z" 
          fill="url(#ribbonGrad)" 
          stroke="#B45309" 
          stroke-width="2"/>
    
    <!-- Ribbon Border Highlights -->
    <path d="M 95,386 L 405,386" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Motto Text -->
    <text x="250" y="415" font-family="'Cinzel', 'Georgia', serif" font-size="17" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="3">
      LEADERSHIP ACADEMY
    </text>
  </g>

  <!-- Decorative Stars on sides -->
  <polygon points="78,250 82,258 91,259 84,265 86,274 78,269 70,274 72,265 65,259 74,258" fill="url(#goldGrad)"/>
  <polygon points="422,250 426,258 435,259 428,265 430,274 422,269 414,274 416,265 409,259 418,258" fill="url(#goldGrad)"/>
</svg>
